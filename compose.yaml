# Volume names come from this name, not from the folder name
name: iiot-edge-gateway

services:
  influxdb:
    # The tag is for people, Docker uses the digest: a tag can be moved to another build
    image: influxdb:2.9.1@sha256:e4572d094ac3272f06528ea904ce6b4cb3bb19be2db3b3b1acbd27ba5c3a73e2
    ports:
      # Only this computer can open the database
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      # The image declares this volume too. Without it, Docker creates a new anonymous volume
      - influxdb-config:/etc/influxdb2
    environment:
      # Setup runs only once, on an empty volume. Later changes here have no effect
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_ORG: iiot
      DOCKER_INFLUXDB_INIT_BUCKET: gateway
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?set INFLUX_PASSWORD in .env}
      # InfluxDB 2.9 stores only a hash of the token, so we set the token ourselves
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN:?set INFLUX_ADMIN_TOKEN in .env}
      # By default, InfluxDB sends usage data to InfluxData
      INFLUXD_REPORTING_DISABLED: "true"

volumes:
  influxdb-data:
  influxdb-config:
